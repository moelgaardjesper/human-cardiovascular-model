[pytest]
testpaths = tests

# Slow-dynamics validation runs multi-hour simulations. Those tests are marked
# `slow` and are DESELECTED BY DEFAULT so the fast regression suite — which is
# the ratchet — stays runnable in ~20 min and keeps gating CI.
#
# `overnight` is a third tier for runs measured in HOURS of wall clock, not
# minutes. It exists because the only sourced targets for 24 h refill
# (Lister 1963: 27.9 mL/h over 0-24 h, 50-80 % of the loss replaced) cannot be
# reached by a 2 h simulation, and a test nobody can afford to run is a test
# that silently rots. Deselected by BOTH default and `-m slow`.
#
#   pytest                  → fast suite only (default; what CI runs)
#   pytest -m slow          → slow-dynamics suite only (command-line -m wins)
#   pytest -m overnight     → the hours-long runs
#   pytest -m ""            → everything
#
# MEASURED THROUGHPUT, 2026-08-30: 0.46 s of wall clock per simulated second,
# i.e. ~2.2x faster than real time on this machine. The older note in this file
# and in CLAUDE.md said 3x; the model has grown since. Budget from 2.2x:
#   2 h scenario  → ~55 min      12 h scenario → ~5.5 h
#   6 h scenario  → ~2.7 h       24 h scenario → ~11 h
addopts = -m "not slow and not overnight"

markers =
    slow: multi-hour simulation; validates dynamics on the minutes-to-hours
        timescale (transcapillary refill, venous stress relaxation, RAAS/ADH,
        baroreflex resetting). Not run by default or in CI.
    overnight: simulation measured in HOURS of wall clock (24 h scenarios).
        Deselected by default AND by -m slow. Run deliberately, in the
        background, with output_path set so a crash does not lose the run.
