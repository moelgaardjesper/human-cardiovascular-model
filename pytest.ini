[pytest]
testpaths = tests

# Slow-dynamics validation runs multi-hour simulations (~38 min of wall time
# per 2 h scenario at 3x real time). Those tests are marked `slow` and are
# DESELECTED BY DEFAULT so the fast regression suite — which is the ratchet —
# stays runnable in ~13 min and keeps gating CI.
#
#   pytest                  → fast suite only (default; what CI runs)
#   pytest -m slow          → slow-dynamics suite only (command-line -m wins)
#   pytest -m ""            → everything
addopts = -m "not slow"

markers =
    slow: multi-hour simulation; validates dynamics on the minutes-to-hours
        timescale (transcapillary refill, venous stress relaxation, RAAS/ADH,
        baroreflex resetting). Not run by default or in CI.
